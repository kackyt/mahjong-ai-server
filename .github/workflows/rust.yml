name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: install
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake gdb strace libssl-dev pkg-config build-essential libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev libc6-dev-i386 gcc-multilib \
        libxdo-dev \
        libssl-dev \
        libayatana-appindicator3-dev \
        librsvg2-dev
    - uses: actions/checkout@v4
      with:
        submodules: recursive
      
    - name: Install latest stable
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Run cargo fmt
      run: cargo fmt --all -- --check

    - name: Run cargo clippy
      run: cargo clippy --workspace --all-targets --all-features --exclude loadlibrary -- -D warnings

    - name: Run cargo check
      run: cargo check --workspace --all-targets --exclude loadlibrary --verbose

    - name: Run cargo test
      run: cargo test --workspace --all-targets --exclude loadlibrary --verbose
